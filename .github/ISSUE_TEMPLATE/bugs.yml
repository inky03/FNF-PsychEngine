name: Bug Report
description: Report bugs with the engine here
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: "Describe your bug here."
    validations:
      required: true

  - type: textarea
    id: terminal
    attributes:
      label: "Command Prompt / Terminal / Debug logs (if existing)"
      render: bash
    validations:
      required: false

  - type: dropdown
    id: modtype
    attributes:
      label: "Does this happen in a Source Code Modification, or a Modpack?"
      options:
        - Source Code Mod
        - Modpack
    validations:
      required: true

  - type: dropdown
    id: buildtarget
    attributes:
      label: "What target are you using?"
      options:
        - "Windows"
        - "Linux"
        - "Mac"
        - "HTML5"
        - "Flash/Air-based target"
        - "Neko, HashLink, or other build system"
    validations:
      required: true

  - type: input
    id: buildsummary
    attributes:
      label: "Did you edit anything from source code? Summarize your changes."
      description: "You may ignore this question if you are not making a source code mod!"
      placeholder: "I edited ClientPrefs.hx and tried to add a new setting"
    validations:
      required: false
